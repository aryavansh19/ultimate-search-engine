<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link Memory</title>
<style>
  :root {
    --bg: #0b0d12;
    --bg-soft: #10131a;
    --panel: #151922;
    --panel-2: #1b202b;
    --line: #262c39;
    --line-soft: #1f2531;
    --text: #e8eaf0;
    --muted: #929cad;
    --dim: #6c7688;
    --accent: #7aa2f7;
    --accent-soft: #33415f;
    --good: #6ee7a8;
    --good-dim: #1f4736;
    --warn: #e8b96b;
    --warn-dim: #4a3a1c;
    --bad: #f78499;
    --bad-dim: #4a2029;
    --mark: #4d4213;
    --radius: 14px;
    --ease: cubic-bezier(.22, .61, .36, 1);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background:
      radial-gradient(1100px 500px at 12% -8%, #17203a 0%, transparent 60%),
      radial-gradient(900px 400px at 95% 0%, #1b1630 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  a { color: var(--accent); }
  .wrap { max-width: 940px; margin: 0 auto; padding: 34px 20px 100px; }

  /* ---------------------------------------------------------------- header */
  header { margin-bottom: 24px; }
  header h1 {
    font-size: 23px; margin: 0 0 5px; font-weight: 650; letter-spacing: -.02em;
    display: flex; align-items: center; gap: 10px;
  }
  header h1 .spark {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--good); box-shadow: 0 0 14px var(--good);
    animation: breathe 3.4s var(--ease) infinite;
  }
  @keyframes breathe { 0%,100% { opacity: .45; transform: scale(.82) } 50% { opacity: 1; transform: scale(1) } }
  header p { margin: 0; color: var(--muted); font-size: 13.5px; }

  /* ----------------------------------------------------------------- cards */
  .card {
    background: linear-gradient(180deg, rgba(255,255,255,.028), rgba(255,255,255,0)) , var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 15px;
    margin-bottom: 14px;
    box-shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 26px -18px rgba(0,0,0,.9);
  }
  label { display: block; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase;
          color: var(--dim); margin-bottom: 7px; font-weight: 600; }
  .row { display: flex; gap: 9px; }
  input[type=url], input[type=search] {
    flex: 1; min-width: 0;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 10px; padding: 11px 13px; font: inherit;
    transition: border-color .18s var(--ease), box-shadow .18s var(--ease), background .18s;
  }
  input[type=search] { font-size: 16.5px; padding: 13px 15px; padding-right: 96px; }
  input::placeholder { color: var(--dim); }
  input:hover { border-color: #333b4b; }
  input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(122,162,247,.14);
    background: #1d2331;
  }
  button {
    background: linear-gradient(180deg, #35486f, #2b3a5c);
    color: var(--text); border: 1px solid #3d5480;
    border-radius: 10px; padding: 11px 18px; font: inherit; font-weight: 550;
    cursor: pointer; white-space: nowrap;
    transition: transform .12s var(--ease), filter .18s, opacity .18s;
  }
  button:hover:not(:disabled) { filter: brightness(1.16); }
  button:active:not(:disabled) { transform: translateY(1px) scale(.99); }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* --------------------------------------------------------------- statuses */
  .statusline { display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
                font-size: 12.5px; color: var(--muted); min-height: 18px; margin-top: 11px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none;
         box-shadow: 0 0 10px var(--warn); animation: pulse 1.15s var(--ease) infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1) } 50% { opacity: .25; transform: scale(.7) } }
  .stage-track { display: flex; gap: 4px; align-items: center; }
  .stage-pip { width: 22px; height: 3px; border-radius: 2px; background: var(--line); transition: background .3s var(--ease); }
  .stage-pip.done { background: var(--good); }
  .stage-pip.active { background: var(--warn); animation: pulse 1.15s var(--ease) infinite; }

  /* Dismiss control on the failure notice. A failure is news, not a permanent fixture. */
  .dismiss { flex: none; margin-left: 2px; width: 18px; height: 18px; padding: 0;
             display: inline-flex; align-items: center; justify-content: center;
             font-size: 14px; line-height: 1; border-radius: 50%;
             background: transparent; color: var(--dim); border: 1px solid var(--line);
             cursor: pointer; transition: color .2s var(--ease), border-color .2s var(--ease),
                                          background .2s var(--ease), transform .2s var(--ease); }
  .dismiss:hover { color: var(--text); border-color: var(--muted); background: #232a38; transform: rotate(90deg); }

  .searchbar { position: relative; }
  .searchhint {
    position: absolute; right: 27px; top: 43px; transform: translateY(-50%);
    font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; font-weight: 600;
    color: var(--dim); pointer-events: none;
    padding: 3px 8px; border-radius: 20px; background: #232a38; border: 1px solid var(--line);
    transition: color .2s, border-color .2s, opacity .2s;
  }
  .searchhint.thinking { color: var(--warn); border-color: var(--warn-dim); }
  .searchhint.semantic { color: var(--good); border-color: var(--good-dim); }

  /* ----------------------------------------------------------------- list */
  h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--dim); margin: 28px 0 12px; font-weight: 650; display: flex;
       align-items: center; gap: 9px; }
  h2 .count { color: var(--muted); font-weight: 500; letter-spacing: 0; text-transform: none; font-size: 12px; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li {
    display: flex; gap: 13px; padding: 13px;
    border: 1px solid var(--line-soft); border-radius: var(--radius);
    background: var(--panel); margin-bottom: 11px; cursor: pointer;
    transition: transform .16s var(--ease), border-color .16s, background .16s, box-shadow .16s;
    animation: rise .34s var(--ease) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(7px) } to { opacity: 1; transform: none } }
  ul.list li:hover {
    transform: translateY(-2px); border-color: #34405a; background: var(--panel-2);
    box-shadow: 0 14px 30px -22px rgba(0,0,0,1);
  }
  ul.list li:active { transform: translateY(0); }

  .thumb { width: 76px; height: 76px; border-radius: 10px; object-fit: cover;
           background: var(--panel-2); flex: none; }
  .thumb.ph { display: grid; place-items: center; color: var(--dim); font-size: 24px;
              border: 1px solid var(--line); }
  .body { min-width: 0; flex: 1; }
  .title { font-weight: 600; margin: 0 0 3px; font-size: 15px; letter-spacing: -.01em; }
  .summary { margin: 0 0 7px; color: #b8c0cf; font-size: 13px;
             display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .matched { margin: 7px 0 0; font-size: 12px; color: var(--muted);
             border-left: 2px solid #33415f; padding-left: 9px; }
  mark { background: var(--mark); color: #ffe9a8; border-radius: 3px; padding: 0 2px; }

  /* ---------------------------------------------------------------- badges */
  .badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 20px;
           background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
           display: inline-flex; align-items: center; gap: 5px; }
  .badge.tag { color: #aeb8c8; }
  .badge.both  { border-color: var(--good-dim); color: var(--good); }
  .badge.vector { border-color: var(--accent-soft); color: var(--accent); }
  .badge.keyword { border-color: var(--warn-dim); color: var(--warn); }

  /* analysis coverage badge — the visual centrepiece */
  .cov { font-weight: 600; letter-spacing: .01em; position: relative; overflow: hidden; }
  .cov .ic { font-size: 11px; line-height: 1; }
  .cov.full {
    background: linear-gradient(135deg, #7ff0b4, #4fd39a);
    border-color: #5bd6a2; color: #05301f;
    box-shadow: 0 0 0 1px rgba(110,231,168,.25), 0 4px 14px -6px rgba(110,231,168,.5);
  }
  .cov.full::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.55) 50%, transparent 65%);
    transform: translateX(-120%);
    animation: sheen 4.5s var(--ease) 1.2s infinite;
  }
  @keyframes sheen { 0% { transform: translateX(-120%) } 22%,100% { transform: translateX(120%) } }
  .cov.part { color: var(--warn); border-color: var(--warn-dim); background: #241d10; }
  .cov.thin { color: var(--bad); border-color: var(--bad-dim); background: #251419; }
  .cov.text { color: var(--muted); }

  button.deepen {
    font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 600;
    background: transparent; border: 1px dashed #3a4a6d; color: var(--accent);
  }
  button.deepen:hover:not(:disabled) { background: #24314d; border-style: solid; }

  .blocked { background: #2a151a; border: 1px solid var(--bad-dim); color: #ffc2ce;
             border-radius: 10px; padding: 11px 14px; font-size: 13px; margin: 0 0 16px; }
  .empty { color: var(--muted); font-size: 13.5px; padding: 26px 4px; text-align: center; }
  .note { color: var(--warn); font-size: 12px; }
  .err { color: var(--bad); font-size: 12px; margin: 8px 0 0; }
  .meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 11.5px; color: var(--dim);
          margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--line-soft); }

  /* skeleton shimmer while the first load lands */
  .skel { height: 102px; border-radius: var(--radius); border: 1px solid var(--line-soft);
          background: linear-gradient(90deg, var(--panel) 25%, var(--panel-2) 37%, var(--panel) 63%);
          background-size: 400% 100%; animation: shimmer 1.5s linear infinite; margin-bottom: 11px; }
  @keyframes shimmer { 0% { background-position: 100% 0 } 100% { background-position: 0 0 } }

  /* ---------------------------------------------------------------- drawer */
  .scrim {
    position: fixed; inset: 0; background: rgba(4,6,10,.66);
    backdrop-filter: blur(3px); opacity: 0; pointer-events: none;
    transition: opacity .26s var(--ease); z-index: 40;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: min(560px, 100%);
    background: var(--bg-soft); border-left: 1px solid var(--line);
    transform: translateX(101%); transition: transform .32s var(--ease);
    z-index: 41; display: flex; flex-direction: column;
    box-shadow: -30px 0 60px -30px rgba(0,0,0,1);
  }
  .drawer.open { transform: none; }
  .drawer header.dh {
    display: flex; align-items: flex-start; gap: 12px; padding: 17px 18px;
    border-bottom: 1px solid var(--line-soft); margin: 0;
  }
  .drawer .dh h3 { margin: 0 0 4px; font-size: 15.5px; font-weight: 620; letter-spacing: -.01em; }
  .drawer .dh .sub { color: var(--muted); font-size: 12.5px; }
  .closebtn { background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
              border-radius: 9px; padding: 6px 11px; font-size: 15px; line-height: 1; flex: none; }
  .dbody { overflow-y: auto; padding: 4px 18px 40px; flex: 1; }
  .dbody::-webkit-scrollbar { width: 10px; }
  .dbody::-webkit-scrollbar-thumb { background: #262d3b; border-radius: 8px; border: 3px solid var(--bg-soft); }

  .sect { margin-top: 22px; }
  .sect > h4 { margin: 0 0 10px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
               color: var(--dim); font-weight: 650; }
  .prose { color: #c3cad8; font-size: 13.5px; margin: 0; }

  /* details timeline — staggered reveal */
  ol.details { list-style: none; margin: 0; padding: 0; }
  ol.details li {
    position: relative; padding: 0 0 13px 22px; font-size: 13.5px; color: #cdd4e1;
    animation: slidein .4s var(--ease) both;
  }
  ol.details li::before {
    content: ""; position: absolute; left: 5px; top: 7px; width: 7px; height: 7px;
    border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(122,162,247,.13);
  }
  ol.details li:not(:last-child)::after {
    content: ""; position: absolute; left: 8px; top: 17px; bottom: 0; width: 1px; background: var(--line);
  }
  @keyframes slidein { from { opacity: 0; transform: translateX(-7px) } to { opacity: 1; transform: none } }

  .kv { display: grid; grid-template-columns: 122px 1fr; gap: 7px 12px; font-size: 12.5px; }
  .kv dt { color: var(--dim); }
  .kv dd { margin: 0; color: #c8cfdc; }
  .transcript { background: #0e1117; border: 1px solid var(--line-soft); border-radius: 10px;
                padding: 12px; font-size: 12.5px; color: #b3bccb; max-height: 220px; overflow-y: auto;
                white-space: pre-wrap; }
  .entgroup { margin-bottom: 9px; }
  .entgroup .lbl { font-size: 11px; color: var(--dim); margin-bottom: 5px; }

  @media (max-width: 620px) {
    .kv { grid-template-columns: 1fr; gap: 2px 0; }
    .kv dt { margin-top: 8px; }
    .thumb { width: 58px; height: 58px; }
  }
  /* Honour the OS setting. Motion here is decoration; nothing depends on it. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important; animation-iteration-count: 1 !important;
      transition-duration: .001ms !important; scroll-behavior: auto !important;
    }
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="spark" aria-hidden="true"></span> Link Memory</h1>
    <p>Save a link. Find it later by whatever you half-remember about it.</p>
  </header>

  <p class="blocked" id="blocked" role="alert" hidden></p>

  <section class="card">
    <label for="url">Add a link</label>
    <div class="row">
      <input id="url" type="url" placeholder="https://www.instagram.com/reels/…" autocomplete="off" spellcheck="false">
      <button id="add">Save</button>
    </div>
    <div class="statusline" id="jobline" aria-live="polite"></div>
    <p class="err" id="adderr" hidden></p>
  </section>

  <section class="card searchbar">
    <label for="q">Search</label>
    <input id="q" type="search" placeholder="that pasta video with the grandma"
           autocomplete="off" spellcheck="false" aria-describedby="searchmeta">
    <span class="searchhint" id="hint" aria-hidden="true"></span>
    <div class="statusline" id="searchmeta" aria-live="polite"></div>
  </section>

  <h2 id="listhead">Library <span class="count" id="listcount"></span></h2>
  <ul class="list" id="results"></ul>
  <div id="skeleton"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  <p class="empty" id="empty" hidden></p>

  <div class="meta" id="stats"></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dtitle" aria-hidden="true">
  <header class="dh">
    <div style="min-width:0;flex:1">
      <h3 id="dtitle">—</h3>
      <div class="sub" id="dsub"></div>
    </div>
    <button class="closebtn" id="dclose" aria-label="Close details">✕</button>
  </header>
  <div class="dbody" id="dbody"></div>
</aside>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const els = {
  url: $("url"), add: $("add"), adderr: $("adderr"), jobline: $("jobline"),
  q: $("q"), hint: $("hint"), searchmeta: $("searchmeta"),
  results: $("results"), empty: $("empty"), listhead: $("listhead"),
  listcount: $("listcount"), stats: $("stats"), skeleton: $("skeleton"),
  scrim: $("scrim"), drawer: $("drawer"), dtitle: $("dtitle"), dsub: $("dsub"),
  dbody: $("dbody"), dclose: $("dclose"),
};

// Two-tier search. Keyword runs on every keystroke because it is FTS-only: no embedding
// request, no cost, ~3ms. Hybrid waits for typing to settle, because each of those is a
// real embedding call -- typing "pasta" would otherwise fire five and show none of the
// first four.
const DEBOUNCE_MS = 300;
let hybridTimer = null, seq = 0, keywordAbort = null, hybridAbort = null;

/* ------------------------------------------------------------------- access token */
// A shared instance is reached through a link carrying ?k=<token>. The token is moved into
// localStorage and stripped from the address bar on first load, so it stops being visible on
// screen, in screenshots, or in whatever the browser syncs from history. Every API call then
// sends it as a header instead.
const TOKEN_KEY = "linkmemory.token";
(function captureToken() {
  const url = new URL(location.href);
  const fromLink = url.searchParams.get("k");
  if (fromLink) {
    try { localStorage.setItem(TOKEN_KEY, fromLink); } catch { /* private mode */ }
    url.searchParams.delete("k");
    history.replaceState(null, "", url.pathname + (url.search || "") + url.hash);
  }
})();

function token() {
  try { return localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; }
}

/** fetch() with the access token attached, and a single place to notice auth failures. */
async function api(path, options = {}) {
  const headers = new Headers(options.headers || {});
  const t = token();
  if (t) headers.set("x-access-token", t);
  const res = await fetch(path, { ...options, headers });
  if (res.status === 401) {
    showBlocked("This link needs an access token. Ask for the full link, including the ?k=… part.");
    throw new Error("unauthorized");
  }
  return res;
}

function showBlocked(message) {
  const bar = $("blocked");
  bar.textContent = message;
  bar.hidden = false;
}

/* ------------------------------------------------------------------ helpers */
const escapeRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const queryTerms = (q) => q.toLowerCase().split(/[^\w]+/).filter((t) => t.length > 1);

function highlight(text, terms) {
  // DOM nodes rather than innerHTML, deliberately. Titles and summaries come from scraped
  // pages and model output, so treating them as markup would be a self-inflicted XSS hole
  // in an app whose whole job is ingesting untrusted content.
  const frag = document.createDocumentFragment();
  if (!text) return frag;
  if (!terms.length) { frag.append(document.createTextNode(text)); return frag; }
  const re = new RegExp("(" + terms.map(escapeRe).join("|") + ")", "ig");
  let last = 0;
  for (const m of text.matchAll(re)) {
    if (m.index > last) frag.append(document.createTextNode(text.slice(last, m.index)));
    const mk = document.createElement("mark");
    mk.textContent = m[0];
    frag.append(mk);
    last = m.index + m[0].length;
  }
  if (last < text.length) frag.append(document.createTextNode(text.slice(last)));
  return frag;
}

const COVERAGE = {
  "video + audio": { cls: "full", ic: "✦", label: "video + audio analysed" },
  "video":         { cls: "full", ic: "✦", label: "video analysed" },
  "transcript only": { cls: "part", ic: "◍", label: "transcript only" },
  "caption only":  { cls: "thin", ic: "◌", label: "caption only" },
  "text":          { cls: "text", ic: "▤", label: "text" },
};

function coverageBadge(item) {
  const spec = COVERAGE[item.analysis] || COVERAGE.text;
  const b = document.createElement("span");
  b.className = "badge cov " + spec.cls;
  const ic = document.createElement("span");
  ic.className = "ic";
  ic.textContent = spec.ic;
  b.append(ic, document.createTextNode(spec.label));
  if (item.detail_count) {
    const n = document.createElement("span");
    n.style.opacity = ".72";
    n.textContent = "· " + item.detail_count;
    b.append(n);
  }
  b.title = "How deeply this item was examined when indexed";
  return b;
}

function placeholder(item) {
  const d = document.createElement("div");
  d.className = "thumb ph";
  const map = { instagram: "◎", youtube: "▶", tiktok: "♪", reddit: "◇", twitter: "✕" };
  d.textContent = map[item.platform] || "❏";
  return d;
}

/* --------------------------------------------------------------------- card */
function card(item, terms, index) {
  const li = document.createElement("li");
  li.style.animationDelay = Math.min(index * 28, 320) + "ms";
  li.tabIndex = 0;
  li.setAttribute("role", "button");
  li.setAttribute("aria-label", "Open details for " + (item.title || item.summary || item.url));

  if (item.thumbnail_url) {
    const img = document.createElement("img");
    img.className = "thumb"; img.src = item.thumbnail_url; img.alt = "";
    img.loading = "lazy"; img.referrerPolicy = "no-referrer";
    img.onerror = () => img.replaceWith(placeholder(item));
    li.append(img);
  } else li.append(placeholder(item));

  const body = document.createElement("div");
  body.className = "body";

  const h = document.createElement("p");
  h.className = "title";
  h.append(highlight(item.title || item.summary || item.url || "untitled", terms));
  body.append(h);

  if (item.summary && item.summary !== item.title) {
    const p = document.createElement("p");
    p.className = "summary";
    p.append(highlight(item.summary, terms));
    body.append(p);
  }

  const badges = document.createElement("div");
  badges.className = "badges";
  badges.append(coverageBadge(item));

  if (item.can_deepen) {
    const btn = document.createElement("button");
    btn.className = "deepen"; btn.type = "button"; btn.textContent = "Analyse video";
    btn.title = "Watch the video and extract on-screen detail (~40s)";
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      btn.disabled = true; btn.textContent = "queued…";
      try { await api(`/api/items/${item.url_hash}/deepen`, { method: "POST" }); pollJobs(); }
      catch { btn.textContent = "failed"; }
    });
    badges.append(btn);
  }

  if (item.found_by) {
    const b = document.createElement("span");
    b.className = "badge " + item.found_by;
    b.textContent = item.found_by + (item.cosine != null ? ` · ${item.cosine.toFixed(2)}` : "");
    badges.append(b);
  }
  for (const v of [item.platform, item.category]) {
    if (!v) continue;
    const b = document.createElement("span"); b.className = "badge"; b.textContent = v;
    badges.append(b);
  }
  for (const tag of (item.tags || []).slice(0, 4)) {
    const b = document.createElement("span"); b.className = "badge tag"; b.textContent = tag;
    badges.append(b);
  }
  body.append(badges);

  if (item.matched_text) {
    const m = document.createElement("p");
    m.className = "matched";
    m.append(highlight(item.matched_text, terms));
    body.append(m);
  }

  li.append(body);
  const open = () => openDrawer(item.url_hash);
  li.addEventListener("click", open);
  li.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
  });
  return li;
}

function render(items, terms, headline) {
  els.skeleton.hidden = true;
  els.listhead.firstChild.textContent = headline + " ";
  els.listcount.textContent = items.length ? `${items.length}` : "";
  els.results.replaceChildren(...items.map((it, i) => card(it, terms, i)));
  els.empty.hidden = items.length > 0;
  if (!items.length) {
    els.empty.textContent = terms.length
      ? "Nothing matched. Try fewer or different words."
      : "No links saved yet. Paste one above to get started.";
  }
}

/* ------------------------------------------------------------------ drawer */
let lastFocused = null;

async function openDrawer(hash) {
  lastFocused = document.activeElement;
  els.drawer.classList.add("open");
  els.scrim.classList.add("open");
  els.drawer.setAttribute("aria-hidden", "false");
  els.dtitle.textContent = "Loading…";
  els.dsub.textContent = "";
  els.dbody.replaceChildren();
  els.dclose.focus();

  let d;
  try {
    const res = await api(`/api/items/${hash}`);
    if (!res.ok) throw new Error("could not load item");
    d = await res.json();
  } catch (e) {
    els.dtitle.textContent = "Could not load";
    return;
  }

  const enr = d.enrichment || {}, ext = d.extraction || {};
  els.dtitle.textContent = d.title || enr.summary || d.url;

  els.dsub.replaceChildren();
  const sub = document.createElement("div");
  sub.className = "badges";
  sub.append(coverageBadge(d));
  for (const v of [d.platform, enr.category, enr.content_type]) {
    if (!v) continue;
    const b = document.createElement("span"); b.className = "badge"; b.textContent = v;
    sub.append(b);
  }
  els.dsub.append(sub);

  const frag = document.createDocumentFragment();

  if (enr.summary) frag.append(section("Summary", para(enr.summary)));
  if (enr.description) frag.append(section("What it is", para(enr.description)));

  if ((enr.details || []).length) {
    const ol = document.createElement("ol");
    ol.className = "details";
    enr.details.forEach((text, i) => {
      const li = document.createElement("li");
      li.style.animationDelay = Math.min(i * 34, 520) + "ms";
      li.textContent = text;
      ol.append(li);
    });
    frag.append(section(`What was seen and heard · ${enr.details.length}`, ol));
  }

  const ent = enr.entities || {};
  const entGroups = [["People", ent.people], ["Organisations", ent.organizations],
                     ["Places", ent.places], ["Products", ent.products]]
    .filter(([, v]) => (v || []).length);
  if (entGroups.length) {
    const box = document.createElement("div");
    for (const [label, values] of entGroups) {
      const g = document.createElement("div"); g.className = "entgroup";
      const l = document.createElement("div"); l.className = "lbl"; l.textContent = label;
      const bs = document.createElement("div"); bs.className = "badges";
      for (const v of values) {
        const b = document.createElement("span"); b.className = "badge tag"; b.textContent = v;
        bs.append(b);
      }
      g.append(l, bs); box.append(g);
    }
    frag.append(section("Mentions", box));
  }

  if ((enr.tags || []).length) {
    const bs = document.createElement("div"); bs.className = "badges";
    for (const t of enr.tags) {
      const b = document.createElement("span"); b.className = "badge tag"; b.textContent = t;
      bs.append(b);
    }
    frag.append(section("Tags", bs));
  }

  if (ext.transcript_excerpt) {
    const pre = document.createElement("div");
    pre.className = "transcript";
    pre.textContent = ext.transcript_excerpt;
    const wrap = document.createElement("div");
    wrap.append(pre);
    if (ext.transcript_chars > ext.transcript_excerpt.length) {
      const n = document.createElement("div");
      n.className = "lbl"; n.style.marginTop = "7px";
      n.textContent = `showing first ${ext.transcript_excerpt.length} of ${ext.transcript_chars} characters`;
      wrap.append(n);
    }
    frag.append(section("Transcript", wrap));
  }

  if (ext.caption) frag.append(section("Original caption", para(ext.caption)));

  // How it was produced. Useful precisely because "was the video actually analysed?"
  // is otherwise unanswerable from the outside.
  const dl = document.createElement("dl");
  dl.className = "kv";
  const rows = [
    ["Extracted by", ext.tier ? `${ext.tier}${ext.note ? " · " + ext.note : ""}` : null],
    ["Text signal", ext.signal ? `${ext.signal} (${ext.word_count} words)` : null],
    ["Duration", ext.duration_s ? `${Math.round(ext.duration_s)}s` : null],
    ["Tagged by", enr.provider ? `${enr.provider} · ${enr.model || "-"}` : null],
    ["Mode", enr.mode || null],
    ["Tokens", enr.input_tokens ? `${enr.input_tokens} in / ${enr.output_tokens} out` : null],
    ["Cost", enr.cost_usd != null ? (enr.cost_usd ? `$${enr.cost_usd.toFixed(6)}` : "free") : null],
    ["Took", enr.duration_ms ? `${(enr.duration_ms / 1000).toFixed(1)}s` : null],
    ["Language", enr.language || null],
    ["Note", enr.note || null],
  ].filter(([, v]) => v);
  for (const [k, v] of rows) {
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.textContent = v;
    dl.append(dt, dd);
  }
  frag.append(section("How this was processed", dl));

  const openLink = document.createElement("a");
  openLink.href = d.url; openLink.target = "_blank"; openLink.rel = "noopener noreferrer";
  openLink.textContent = "Open original ↗";
  openLink.style.fontSize = "13px";
  frag.append(section("Source", openLink));

  els.dbody.replaceChildren(frag);
}

function section(title, node) {
  const s = document.createElement("section");
  s.className = "sect";
  const h = document.createElement("h4");
  h.textContent = title;
  s.append(h, node);
  return s;
}
function para(text) {
  const p = document.createElement("p");
  p.className = "prose";
  p.textContent = text;
  return p;
}

function closeDrawer() {
  els.drawer.classList.remove("open");
  els.scrim.classList.remove("open");
  els.drawer.setAttribute("aria-hidden", "true");
  if (lastFocused && lastFocused.focus) lastFocused.focus();
}
els.dclose.addEventListener("click", closeDrawer);
els.scrim.addEventListener("click", closeDrawer);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && els.drawer.classList.contains("open")) closeDrawer();
});

/* ---------------------------------------------------------------- searching */
async function runSearch(query, mode, mySeq) {
  const ref = mode === "keyword" ? "keywordAbort" : "hybridAbort";
  if (window[ref]) window[ref].abort();
  const controller = new AbortController();
  window[ref] = controller;
  const res = await api(`/api/search?q=${encodeURIComponent(query)}&mode=${mode}&limit=25`,
                        { signal: controller.signal });
  if (!res.ok) throw new Error("search failed " + res.status);
  const data = await res.json();
  // A slower earlier request must never overwrite a newer render.
  return mySeq === seq ? data : null;
}

function setHint(text, cls) {
  els.hint.textContent = text;
  els.hint.className = "searchhint" + (cls ? " " + cls : "");
}

function onInput() {
  const query = els.q.value.trim();
  seq += 1;
  const mySeq = seq;
  clearTimeout(hybridTimer);

  if (!query) {
    setHint("", "");
    els.searchmeta.textContent = "";
    loadLibrary();
    return;
  }

  setHint("instant", "");
  runSearch(query, "keyword", mySeq).then((data) => {
    if (!data) return;
    render(data.hits, queryTerms(query), `Keyword matches`);
    els.searchmeta.textContent =
      `${data.hits.length} keyword match${data.hits.length === 1 ? "" : "es"} — semantic search shortly`;
  }).catch((e) => { if (e.name !== "AbortError") console.warn(e); });

  hybridTimer = setTimeout(() => {
    setHint("thinking", "thinking");
    runSearch(query, "hybrid", mySeq).then((data) => {
      if (!data) return;
      setHint(data.vector_available ? "semantic" : "keyword only",
              data.vector_available ? "semantic" : "");
      render(data.hits, queryTerms(query), `Results`);
      const bits = [`${data.hits.length} result${data.hits.length === 1 ? "" : "s"}`];
      if (data.keyword_candidates) bits.push(`${data.keyword_candidates} keyword candidates`);
      if (data.vector_candidates) bits.push(`${data.vector_candidates} vector candidates`);
      els.searchmeta.textContent = bits.join(" · ");
      for (const note of data.notes || []) {
        const s = document.createElement("span");
        s.className = "note"; s.textContent = note;
        els.searchmeta.append(s);
      }
    }).catch((e) => {
      if (e.name === "AbortError") return;
      setHint("error", ""); console.warn(e);
    });
  }, DEBOUNCE_MS);
}

/* ----------------------------------------------------------------- library */
async function loadLibrary() {
  try {
    const res = await api("/api/items?limit=200");
    const data = await res.json();
    render(data.items, [], "Library");
    els.searchmeta.textContent = "";
  } catch (e) { console.warn(e); }
}

async function loadStats() {
  try {
    const s = await (await api("/api/stats")).json();
    els.stats.replaceChildren();
    for (const text of [
      `${s.documents} links`, `${s.chunks} chunks`, `${s.vectors} vectors`,
      `${s.embed_model} · ${s.dimensions}d`,
      s.vector_available ? "semantic search on" : "semantic search off",
    ]) {
      const span = document.createElement("span");
      span.textContent = text;
      els.stats.append(span);
    }
  } catch (e) { console.warn(e); }
}

/* --------------------------------------------------------------- ingestion */
async function addLink() {
  const url = els.url.value.trim();
  els.adderr.hidden = true;
  if (!url) return;
  els.add.disabled = true;
  try {
    const res = await api("/api/items", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url }),
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      throw new Error(d.detail || `server returned ${res.status}`);
    }
    els.url.value = "";
    pollJobs();
  } catch (e) {
    els.adderr.textContent = String(e.message || e);
    els.adderr.hidden = false;
  } finally { els.add.disabled = false; }
}

const STAGES = ["extracting", "tagging", "indexing"];
let jobTimer = null;

/* Dismissals are kept client-side rather than deleting the server's job row: the row is
   useful history, and on a shared tunnel one visitor clearing a notice should not silently
   rewrite what everyone else sees. Bounded so it cannot grow without limit. */
const DISMISS_KEY = "linkmemory.dismissedJobs";

function readDismissed() {
  try {
    const raw = JSON.parse(localStorage.getItem(DISMISS_KEY) || "[]");
    return Array.isArray(raw) ? raw.map(Number).filter(Number.isFinite) : [];
  } catch { return []; }
}

const isDismissed = (id) => readDismissed().includes(Number(id));

function dismissJob(id) {
  const ids = readDismissed();
  if (!ids.includes(Number(id))) ids.push(Number(id));
  try { localStorage.setItem(DISMISS_KEY, JSON.stringify(ids.slice(-50))); } catch {}
}

async function pollJobs() {
  clearTimeout(jobTimer);
  try {
    const data = await (await api("/api/jobs?limit=6")).json();
    const active = data.active || [];
    els.jobline.replaceChildren();

    if (active.length) {
      const job = active[0];
      const dot = document.createElement("span");
      dot.className = "dot";
      const track = document.createElement("span");
      track.className = "stage-track";
      const at = STAGES.indexOf(job.stage);
      STAGES.forEach((_, i) => {
        const pip = document.createElement("span");
        pip.className = "stage-pip " + (i < at ? "done" : i === at ? "active" : "");
        track.append(pip);
      });
      const text = document.createElement("span");
      const extra = active.length > 1 ? ` · +${active.length - 1} queued` : "";
      text.textContent = `${job.stage} — ${shortUrl(job.url)}${extra}`;
      els.jobline.append(dot, track, text);
      jobTimer = setTimeout(pollJobs, 1200);
      return;
    }

    // Job rows are permanent history, so the newest failure kept being reported forever --
    // including one killed by a server restart whose retry had already succeeded. A failure
    // is only worth showing if it is still that link's outcome and has not been dismissed.
    const recent = data.recent || [];
    const supersededBySuccess = (fail) => recent.some((j) =>
      j.status === "ready" && j.id > fail.id && (
        (j.url_hash && fail.url_hash) ? j.url_hash === fail.url_hash : j.url === fail.url
      ));
    const failed = recent.find((j) =>
      j.status === "failed" && !supersededBySuccess(j) && !isDismissed(j.id));

    if (failed) {
      const s = document.createElement("span");
      s.className = "err";
      s.textContent = `failed: ${shortUrl(failed.url)} — ${failed.error || "unknown"}`;
      const x = document.createElement("button");
      x.className = "dismiss";
      x.type = "button";
      x.textContent = "\u00d7";
      x.title = "Dismiss";
      x.setAttribute("aria-label", `Dismiss failure notice for ${shortUrl(failed.url)}`);
      x.addEventListener("click", () => { dismissJob(failed.id); pollJobs(); });
      els.jobline.append(s, x);
    }
    if (!els.q.value.trim()) loadLibrary(); else onInput();
    loadStats();
  } catch (e) { console.warn(e); }
}

const shortUrl = (u) => {
  try { const p = new URL(u); return p.hostname.replace(/^www\./, "") + p.pathname.slice(0, 22); }
  catch { return String(u).slice(0, 38); }
};

/* --------------------------------------------------------------------- wire */
els.q.addEventListener("input", onInput);
els.add.addEventListener("click", addLink);
els.url.addEventListener("keydown", (e) => { if (e.key === "Enter") addLink(); });
els.q.addEventListener("keydown", (e) => { if (e.key === "Escape") { els.q.value = ""; onInput(); } });

loadLibrary();
loadStats();
pollJobs();
</script>
</body>
